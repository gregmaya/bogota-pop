name: Bug · Error
description: Something in the pipeline or CLI fails or gives a wrong result. · Algo del pipeline o del CLI falla o da un resultado incorrecto.
title: "English title · Título en español"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English and Spanish, and spell out acronyms the first time ([glossary](https://github.com/gregmaya/bogota-pop/blob/main/docs/glossary.md)).
        Escribe en inglés y español, y escribe las siglas completas la primera vez ([glosario](https://github.com/gregmaya/bogota-pop/blob/main/docs/glossary.md)).
  - type: textarea
    id: what
    attributes:
      label: What happened · Qué pasó
      description: Command you ran, what you expected, what you got. · Comando que corriste, qué esperabas y qué obtuviste.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output · Salida del error
      render: text
  - type: input
    id: version
    attributes:
      label: Version · Versión
      description: Output of `uv run bogota-pop --version`, and the vigencia if relevant. · Salida de `uv run bogota-pop --version`, y la vigencia si aplica.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy · Privacidad
      options:
        - label: I have not pasted lot-level data (lot IDs, per-lot estimates) here (ADR-0006). · No pegué datos a nivel de lote (códigos de lote, estimaciones por lote) aquí (ADR-0006).
          required: true
