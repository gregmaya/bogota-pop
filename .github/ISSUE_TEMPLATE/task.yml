name: Task
description: A task from a phase checklist in docs/plan.md.
labels: ["task"]
body:
  - type: input
    id: phase
    attributes:
      label: Phase
      description: e.g. Phase 1 — Data acquisition and inventory
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: The checklist item, copied from docs/plan.md.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know it is finished (tests, outputs, docs).
