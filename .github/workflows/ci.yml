name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dev environment
        run: uv sync --locked
      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Same hooks as local commits: ruff, formatting, file checks, 1 MB data guard, uv.lock sync
      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Plan Phase 0: confirm GDAL, PROJ and DuckDB spatial on macOS and in CI (Linux)
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install environment from uv.lock
        run: uv sync --locked
      - name: CLI entry point
        run: uv run bogota-pop --help
      - name: Report geospatial stack versions
        run: >
          uv run python -c "import pyogrio, pyproj, duckdb;
          print('GDAL', pyogrio.__gdal_version_string__, '| PROJ', pyproj.proj_version_str,
          '| DuckDB', duckdb.__version__)"
      - name: Tests
        run: uv run pytest
      # ADR-0010: the pipeline runs end to end, and a second run has nothing to do
      - name: Pipeline (Snakemake)
        run: |
          uv run snakemake -s pipeline/Snakefile -c1 --config offline=1
          uv run snakemake -s pipeline/Snakefile -n --config offline=1 | tee dry-run.txt
          grep -q "Nothing to be done" dry-run.txt
