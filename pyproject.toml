[project]
name = "bogota-pop"
version = "0.0.1"
description = "Open, reproducible population estimates for every cadastral lot in Bogotá, published at block and H3 level."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gregorio Maya" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10", # wheels bundle GDAL
    "pyproj>=3.7", # wheels bundle PROJ (EPSG:9377)
    "pyarrow>=18", # GeoParquet
    "duckdb>=2.0", # 2.0 API; spatial extension installed at runtime
    "tobler>=0.12",
    "h3>=4.1",
    "pyyaml>=6.0",
    "typer>=0.15",
    "snakemake>=9",
]

[project.scripts]
bogota-pop = "bogota_pop.cli:app"

[project.urls]
Repository = "https://github.com/gregmaya/bogota-pop"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bogota_pop"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "B",   # bugbear: likely bugs (mutable defaults, etc.)
    "UP",  # pyupgrade: modern syntax for py312
    "SIM", # simplifications
    "RUF", # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"] # imports after markdown/setup cells

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: end-to-end run on the one-UPZ fixture (tests/fixtures/)",
]
